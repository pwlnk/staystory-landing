<svg width="600" height="500" viewBox="0 0 600 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="600" height="500" fill="url(#gradient1)"/>
  
  <!-- Gradient definitions -->
  <defs>
    <linearGradient id="gradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:0.1" />
    </linearGradient>
    <linearGradient id="gradient2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Hotel building -->
  <g transform="translate(150, 80)">
    <!-- Main building -->
    <rect x="0" y="50" width="300" height="320" fill="#ffffff" rx="8"/>
    
    <!-- Windows - rows of windows -->
    <g fill="#667eea" opacity="0.3">
      <!-- Floor 1 -->
      <rect x="30" y="80" width="40" height="50" rx="4"/>
      <rect x="90" y="80" width="40" height="50" rx="4"/>
      <rect x="150" y="80" width="40" height="50" rx="4"/>
      <rect x="210" y="80" width="40" height="50" rx="4"/>
      
      <!-- Floor 2 -->
      <rect x="30" y="150" width="40" height="50" rx="4"/>
      <rect x="90" y="150" width="40" height="50" rx="4"/>
      <rect x="150" y="150" width="40" height="50" rx="4"/>
      <rect x="210" y="150" width="40" height="50" rx="4"/>
      
      <!-- Floor 3 -->
      <rect x="30" y="220" width="40" height="50" rx="4"/>
      <rect x="90" y="220" width="40" height="50" rx="4"/>
      <rect x="150" y="220" width="40" height="50" rx="4"/>
      <rect x="210" y="220" width="40" height="50" rx="4"/>
      
      <!-- Floor 4 -->
      <rect x="30" y="290" width="40" height="50" rx="4"/>
      <rect x="90" y="290" width="40" height="50" rx="4"/>
      <rect x="150" y="290" width="40" height="50" rx="4"/>
      <rect x="210" y="290" width="40" height="50" rx="4"/>
    </g>
    
    <!-- Entrance -->
    <rect x="120" y="300" width="60" height="70" fill="url(#gradient2)" rx="4"/>
    <circle cx="165" cy="335" r="3" fill="#ffffff"/>
    
    <!-- Roof accent -->
    <path d="M 0 50 L 150 10 L 300 50 Z" fill="#764ba2" opacity="0.8"/>
  </g>
  
  <!-- Floating elements - phone/tablet -->
  <g transform="translate(50, 150)">
    <rect x="0" y="0" width="80" height="140" fill="#ffffff" rx="8" stroke="#667eea" stroke-width="3"/>
    <rect x="10" y="15" width="60" height="100" fill="#667eea" opacity="0.2" rx="4"/>
    <line x1="20" y1="125" x2="60" y2="125" stroke="#667eea" stroke-width="3" stroke-linecap="round"/>
  </g>
  
  <!-- QR Code representation -->
  <g transform="translate(470, 200)">
    <rect x="0" y="0" width="80" height="80" fill="#ffffff" rx="4" stroke="#764ba2" stroke-width="2"/>
    <rect x="10" y="10" width="60" height="60" fill="#764ba2" opacity="0.3" rx="2"/>
    <circle cx="25" cy="25" r="5" fill="#764ba2"/>
    <circle cx="55" cy="25" r="5" fill="#764ba2"/>
    <circle cx="25" cy="55" r="5" fill="#764ba2"/>
    <rect x="45" y="45" width="20" height="20" fill="#764ba2" rx="2"/>
  </g>
  
  <!-- Decorative circles -->
  <circle cx="80" cy="80" r="30" fill="#667eea" opacity="0.1"/>
  <circle cx="520" cy="400" r="40" fill="#764ba2" opacity="0.1"/>
  <circle cx="100" cy="400" r="20" fill="#667eea" opacity="0.15"/>
  
  <!-- WiFi icon -->
  <g transform="translate(480, 80)">
    <path d="M 20 40 Q 20 20 40 20 Q 60 20 60 40" stroke="#667eea" stroke-width="3" fill="none" opacity="0.5"/>
    <path d="M 25 40 Q 25 28 40 28 Q 55 28 55 40" stroke="#667eea" stroke-width="3" fill="none" opacity="0.5"/>
    <circle cx="40" cy="42" r="3" fill="#667eea" opacity="0.5"/>
  </g>
</svg>
